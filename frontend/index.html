<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/assets/wsa-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e8b53" />
    <meta
      name="description"
      content="HomelyHub - Discover and book unique stay accommodations, vacation rentals, apartments, and plan custom trip itineraries with AI."
    />
    <meta name="keywords" content="homelyhub, stay bookings, vacation rentals, trip planner, AI travel, accommodations" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://homelyhub.vercel.app/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://homelyhub.vercel.app/" />
    <meta property="og:title" content="HomelyHub — AI-Powered Stay Booking & Trip Planner" />
    <meta
      property="og:description"
      content="Discover unique properties, vacation rentals, apartments, and generate day-by-day travel itineraries with AI."
    />
    <meta property="og:image" content="https://homelyhub.vercel.app/assets/logo.png" />
    <meta property="og:site_name" content="HomelyHub" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://homelyhub.vercel.app/" />
    <meta name="twitter:title" content="HomelyHub — AI-Powered Stay Booking & Trip Planner" />
    <meta
      name="twitter:description"
      content="Discover unique properties, vacation rentals, apartments, and generate day-by-day travel itineraries with AI."
    />
    <meta name="twitter:image" content="https://homelyhub.vercel.app/assets/logo.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HomelyHub",
        "url": "https://homelyhub.vercel.app/",
        "description": "Discover and book unique stay accommodations or plan custom trip itineraries with AI.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://homelyhub.vercel.app/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <title>HomelyHub — AI-Powered Stay Booking Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
